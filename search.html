<link rel="stylesheet" href="assets/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
</head>
<body data-root="" data-page-id="search" data-title="Search" class="">
<a class="skip-link" href="#main">Skip to content</a>
<div class="progress" id="readingProgress"></div>
<div class="topbar">
  <a class="brand" href="index.html"><span class="mark"></span> IoT &amp; CPS Security</a>
  <div class="top-actions">
    <button id="openSidebar" class="icon-btn">☰ Menu</button>
    <a class="icon-btn" href="glossary.html">Glossary</a>
    <a class="icon-btn" href="search.html">Search</a>
    <button class="icon-btn theme-toggle">Dark</button>
  </div>
</div>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Course navigation">
    <div class="sidebar-head"><strong style="font-family:var(--font-sans);font-size:.85rem;">Course map</strong>
      <button id="closeSidebar" class="icon-btn">Close</button></div>
    <div class="nav-search"><input id="navSearch" type="search" placeholder="Search lessons…">
      <div class="mini-results"></div></div>
    <nav id="courseNav"></nav>
  </aside>
  <main class="main" id="main">

<nav class="breadcrumb"><a href="index.html">IoT & CPS Security</a> / Search</nav>
<article class="article">
  <span class="kicker">Find anything</span>
  <h1>Search the course</h1>
  <input id="siteSearch" type="search" placeholder="Search lessons by title or topic…"
    style="width:100%;padding:.9rem 1rem;border:1px solid var(--line);border-radius:9px;
    font-family:var(--font-sans);font-size:1rem;margin:1.2rem 0;background:var(--paper-raised);color:var(--ink);">
  <div id="searchResults" style="font-family:var(--font-sans);"></div>
</article>
<script>
document.getElementById('siteSearch').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  const box = document.getElementById('searchResults');
  if(q.length < 2){ box.innerHTML=''; return; }
  const hits = (window.SEARCH_INDEX||[]).filter(x =>
    x.title.toLowerCase().includes(q) || (x.tags||'').toLowerCase().includes(q) || (x.summary||'').toLowerCase().includes(q));
  box.innerHTML = hits.length ? hits.map(h => `<div class="card" style="margin-bottom:.8rem;">
    <a href="${h.url}" style="font-weight:700;">${h.title}</a>
    <div style="color:var(--ink-faint);font-size:.85rem;margin-top:.3rem;">${h.summary||''}</div></div>`).join('')
    : '<p style="color:var(--ink-faint);">No matches.</p>';
});
</script>
  </main>
</div>
<script src="assets/js/nav-data.js"></script>
<script src="assets/js/search-index.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
